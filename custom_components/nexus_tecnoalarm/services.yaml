send_key:
  name: Invia tasto
  description: "Invia la pressione di un tasto alla tastiera remota."
  fields:
    code:
      name: Codice tasto
      description: "Codice numerico del tasto (0-9, o 10-15 per i tasti funzione)."
      example: 1
      required: true
      selector:
        number:
          min: 0
          max: 15
          mode: box
    entry_id:
      name: Gateway
      description: >-
        Necessario solo con piu' di un gateway configurato: identificativo
        della voce di integrazione a cui inviare il tasto.
      required: false
      example: "01J8ZQ4X5N6P7R8S9T0V1W2X3Y"
      selector:
        text:

keypad_presence:
  name: Presenza tastiera
  description: >-
    Segnale di presenza dalla card: tiene attivo il polling della tastiera solo
    mentre la card e' in vista. Viene chiamato automaticamente dalla card, non
    serve invocarlo a mano.
  fields:
    entry_id:
      name: Gateway
      description: "Se omesso, il segnale vale per tutti i gateway configurati."
      required: false
      selector:
        text:

registra_dispositivo:
  name: Abilita questo dispositivo
  description: >-
    Abilita un dispositivo al tastierino automatico in preallarme. La chiama la
    scheda allarme quando accendi l'interruttore su quel dispositivo: non serve
    invocarla a mano.
  fields:
    dispositivo_id:
      name: Identificativo
      description: "L'identificativo che il browser si e' generato."
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text:
    nome:
      name: Nome
      description: "Come chiamarlo nell'elenco delle opzioni."
      required: false
      example: "Tablet ingresso"
      selector:
        text:
    entry_id:
      name: Gateway
      description: "Necessario solo con piu' di un gateway configurato."
      required: false
      selector:
        text:

dimentica_dispositivo:
  name: Revoca questo dispositivo
  description: >-
    Toglie un dispositivo dall'elenco di quelli abilitati al tastierino
    automatico. La chiama la scheda allarme quando spegni l'interruttore.
  fields:
    dispositivo_id:
      name: Identificativo
      description: "L'identificativo del dispositivo da revocare."
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text:
    entry_id:
      name: Gateway
      description: "Necessario solo con piu' di un gateway configurato."
      required: false
      selector:
        text:
